<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="维护仓颉工作台的仓库清单、GitCode 设置快照和共享标签。">
  <meta name="theme-color" content="#181b16">
  <title>仓库配置 · 仓颉工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23d5fa63'/%3E%3Cpath fill='none' stroke='%23191c15' stroke-width='3.5' stroke-linecap='square' d='M18 13 8 24l10 11m12-22 10 11-10 11m-9-1 6-20'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./repositories.js"></script>
</head>
<body>
  <a class="skip-link" href="#repos">跳至仓库清单</a>
  <aside class="sidebar">
    <a class="brand" href="./"><span class="brand-mark" data-icon="code"></span><span>仓颉工作台<small>GITCODE WORKBENCH</small></span></a>
    <nav class="side-content" aria-label="工作台导航">
      <p class="nav-label">工作区</p>
      <a class="side-button active" href="#repos" aria-current="page"><span data-icon="repo"></span>仓库配置<span class="nav-pointer" aria-hidden="true">↗</span></a>
      <a class="side-button" href="./index.html" data-tag-route="./index.html"><span data-icon="grid"></span>AI 检视管理</a>
      <a class="side-button" href="./metrics.html" data-tag-route="./metrics.html"><span data-icon="chart"></span>AI 检视统计</a>
    </nav>
    <a class="side-org" href="https://gitcode.com/Cangjie" target="_blank" rel="noopener noreferrer"><span class="org-mark">CJ</span><span>Cangjie<small>GitCode 组织</small></span><span class="side-arrow" data-icon="external"></span></a>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="breadcrumbs"><a href="./index.html">个人工作台</a><span class="slash" aria-hidden="true">/</span><strong>仓库配置</strong></div>
    </header>
    <section class="hero config-hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <h1 id="page-title">仓库配置<span>.</span></h1>
        <p>在这里更新 GitCode 设置快照和仓库标签。AI 检视管理与统计共用这些配置。</p>
      </div>
      <div class="coverage" aria-label="仓库清单概况">
        <div class="coverage-top"><span>仓库清单</span><span data-icon="repo"></span></div>
        <div class="coverage-number" id="catalog-total">—</div>
        <p class="config-summary" id="catalog-status"></p>
      </div>
    </section>
    <section class="repository-section config-section" id="repos" aria-labelledby="repos-title">
      <div class="section-heading">
        <div><h2 id="repos-title">仓库清单 <span id="repo-total" class="counter">—</span></h2><p id="data-date">正在载入仓库清单</p></div>
        <div class="config-actions">
          <button class="button" id="export-button" type="button" disabled><span data-icon="download"></span>导出快照</button>
          <button class="button button-primary" id="top-sync" type="button" disabled><span data-icon="sync"></span>更新数据</button>
        </div>
      </div>
      <p class="config-warning" id="config-warnings" role="status" hidden></p>
      <div class="table-card">
        <div class="tag-tools" role="group" aria-label="仓库标签">
          <div class="tag-scope">
            <label for="tag-filter">仓库标签</label>
            <select class="tag-field" id="tag-filter"><option value="">全部标签</option></select>
          </div>
          <div class="tag-actions">
            <span id="tag-selection-count" role="status" hidden></span>
            <button class="button" id="tag-clear-selection" type="button" hidden>清空选择</button>
            <button class="button button-primary" id="tag-batch" type="button" disabled>批量编辑标签</button>
            <button class="button" id="tag-config" type="button">标签配置</button>
          </div>
        </div>
        <div class="table-tools config-tools">
          <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索仓库或标签…" aria-label="搜索仓库" autocomplete="off"><kbd>/</kbd></label>
        </div>
        <div class="table-scroll" tabindex="0" aria-label="仓库配置表格，可横向滚动">
          <table class="config-table">
            <thead><tr><th scope="col" class="repo-select"><input id="tag-select-all" type="checkbox" aria-label="选择当前显示的仓库" disabled></th><th scope="col">仓库</th><th scope="col">标签</th><th scope="col">设置采集时间</th><th scope="col" class="row-end">GitCode 设置</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="table-foot"><span id="result-count" role="status"></span><a id="org-repositories" href="https://gitcode.com/org/Cangjie/repos" target="_blank" rel="noopener noreferrer">GitCode 仓库清单 <span data-icon="external"></span></a></div>
      </div>
    </section>
    <footer><span>仓颉工作台</span><a href="https://docs.gitcode.com/docs/help/home/org_project/codereview/ai_codereview/" target="_blank" rel="noopener noreferrer">AtomCode AI Review 文档 <span data-icon="external"></span></a></footer>
  </main>
  <dialog id="sync-dialog" class="modal" aria-labelledby="sync-title"></dialog>
  <dialog id="tag-dialog" class="modal" aria-labelledby="tag-title"></dialog>
  <input id="file-input" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
