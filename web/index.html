<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="仓颉 GitCode 社区的 AI 检视配置工作台。">
  <meta name="theme-color" content="#181b16">
  <title>AI 检视管理 · 仓颉工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23d5fa63'/%3E%3Cpath fill='none' stroke='%23191c15' stroke-width='3.5' stroke-linecap='square' d='M18 13 8 24l10 11m12-22 10 11-10 11m-9-1 6-20'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#repos">跳至仓库表格</a>
  <aside class="sidebar" aria-label="工作台导航">
    <a class="brand" href="./"><span class="brand-mark" data-icon="code"></span><span>仓颉工作台<small>GITCODE WORKBENCH</small></span></a>
    <div class="side-content">
      <p class="nav-label">工作区</p>
      <button class="side-button active" id="nav-repos" aria-current="page"><span data-icon="grid"></span>AI 检视管理<span class="nav-pointer">↗</span></button>
      <a class="side-button" href="./metrics.html"><span data-icon="chart"></span>AI 检视统计</a>
      <button class="side-button" id="nav-sync"><span data-icon="sync"></span>更新数据</button>
    </div>
    <a class="side-org" href="https://gitcode.com/Cangjie" target="_blank" rel="noopener noreferrer"><span class="org-mark">CJ</span><span>Cangjie<small>GitCode 组织</small></span><span class="side-arrow" data-icon="external"></span></a>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="breadcrumbs"><span>个人工作台</span><span class="slash">/</span><strong>AI 检视管理</strong></div>
      <button class="button button-quiet" id="top-sync"><span data-icon="sync"></span>更新数据</button>
    </header>
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <div class="hero-org"><span class="hero-org-dot"></span>GITCODE / CANGJIE</div>
        <h1 id="page-title">AI 检视管理<span>.</span></h1>
        <p>盘点仓颉仓库的 AI 检视、PR 创建触发和自定义 Skills。</p>
      </div>
      <div class="coverage" aria-label="配置核实进度">
        <div class="coverage-top"><span>配置核实</span><span data-icon="scan"></span></div>
        <div class="coverage-number" id="coverage-number">—</div>
        <div class="coverage-grid" id="coverage-grid" aria-hidden="true"></div>
        <div class="coverage-legend"><span><i class="legend-dot verified"></i>已核实</span><span><i class="legend-dot"></i>待核实</span></div>
      </div>
    </section>
    <section class="metrics" aria-label="仓库统计" id="metrics"></section>
    <section class="repository-section" id="repos" aria-labelledby="repos-title">
      <div class="section-heading">
        <div><h2 id="repos-title">仓库清单 <span id="repo-total" class="counter">—</span></h2><p id="data-date">正在载入仓库清单</p></div>
        <button class="button" id="export-button"><span data-icon="download"></span>导出快照</button>
      </div>
      <div class="table-card">
        <div class="table-tools">
          <div id="filters" class="filters" role="group" aria-label="筛选仓库"></div>
          <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索仓库…" aria-label="搜索仓库" autocomplete="off"><kbd>/</kbd></label>
        </div>
        <div class="table-scroll" tabindex="0" aria-label="仓库配置表格，可横向滚动">
          <table>
            <thead><tr><th scope="col">仓库</th><th scope="col">AI 检视</th><th scope="col">PR 创建自动检视</th><th scope="col">自定义 Skill</th><th scope="col" class="row-end">详情</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="table-foot"><span id="result-count" role="status"></span><a href="https://gitcode.com/org/Cangjie/repos" target="_blank" rel="noopener noreferrer">GitCode 仓库清单 <span data-icon="external"></span></a></div>
      </div>
    </section>
    <footer><span>仓颉工作台</span><a href="https://docs.gitcode.com/docs/help/home/org_project/codereview/ai_codereview/" target="_blank" rel="noopener noreferrer">AtomCode AI Review 文档 <span data-icon="external"></span></a></footer>
  </main>
  <dialog id="detail-dialog" class="drawer" aria-labelledby="detail-title"></dialog>
  <dialog id="sync-dialog" class="modal" aria-labelledby="sync-title"></dialog>
  <input id="file-input" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
